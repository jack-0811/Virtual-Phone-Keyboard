<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手机虚拟键盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .status {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .status.connected {
            background: rgba(76, 217, 100, 0.3);
        }

        .keyboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .display {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            font-size: 24px;
            text-align: right;
            color: #333;
            word-wrap: break-word;
            border: 2px solid #e0e0e0;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .key {
            background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            padding: 20px;
            font-size: 28px;
            font-weight: 500;
            color: #000;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .key:active {
            transform: scale(0.95);
            background: linear-gradient(180deg, #e0e0e0 0%, #d1d1d6 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .key.pressed {
            animation: pressEffect 0.3s ease;
        }

        @keyframes pressEffect {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); background: #d1d1d6; }
            100% { transform: scale(1); }
        }

        .key.zero {
            grid-column: span 2;
        }

        .key.function {
            background: linear-gradient(180deg, #ff9500 0%, #ff8000 100%);
            color: white;
            font-size: 16px;
            border: none;
        }

        .key.function:active {
            background: linear-gradient(180deg, #e68600 0%, #cc6600 100%);
        }

        .key.backspace {
            background: linear-gradient(180deg, #ff3b30 0%, #e62e24 100%);
            color: white;
            font-size: 20px;
            border: none;
        }

        .key.backspace:active {
            background: linear-gradient(180deg, #e62e24 0%, #cc1f17 100%);
        }

        .key.enter {
            background: linear-gradient(180deg, #34c759 0%, #2fb84a 100%);
            color: white;
            border: none;
        }

        .key.enter:active {
            background: linear-gradient(180deg, #2fb84a 0%, #26a03b 100%);
        }

        .row-special {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .feedback.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> 虚拟小键盘</h1>
            <div class="status" id="status">连接中...</div>
        </div>

        <div class="keyboard">
            <div class="display" id="display">准备就绪</div>
            
            <div class="keys">
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key zero" data-key="0">0</button>
                <button class="key" data-key=".">.</button>
            </div>

            <div class="row-special">
                <button class="key backspace" data-key="backspace">⌫ 退格</button>
                <button class="key enter" data-key="enter">✓ 回车</button>
            </div>
        </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <script>
        // 记录当前按下的按键，防止重复触发
        const activeKeys = new Set();

        // 显示反馈信息
        function showFeedback(message, duration = 2000) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.classList.add('show');
            setTimeout(() => feedback.classList.remove('show'), duration);
        }

        // 更新状态显示
        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.textContent = '✓ 已连接';
                status.classList.add('connected');
            } else {
                status.textContent = '✗ 未连接';
                status.classList.remove('connected');
            }
        }

        // 发送动作到服务器 (keydown 或 keyup)
        async function sendAction(action, key) {
            try {
                // 如果是按下动作且按键已在按下状态，则不重复发送
                if (action === 'keydown' && activeKeys.has(key)) return;
                
                if (action === 'keydown') {
                    activeKeys.add(key);
                    if (navigator.vibrate) navigator.vibrate(10); // 短震动反馈
                } else {
                    activeKeys.delete(key);
                }

                const response = await fetch(`/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('display').textContent = `${action === 'keydown' ? '按下' : '松开'}: ${key}`;
                }
            } catch (error) {
                console.error('网络错误:', error);
                updateStatus(false);
            }
        }

        // 初始化按键事件
        document.querySelectorAll('.key').forEach(button => {
            const key = button.getAttribute('data-key');

            // --- 移动端触摸处理 ---
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                button.classList.add('pressed');
                sendAction('keydown', key);
            });

            button.addEventListener('touchend', (e) => {
                e.preventDefault();
                button.classList.remove('pressed');
                sendAction('keyup', key);
            });

            button.addEventListener('touchcancel', (e) => {
                button.classList.remove('pressed');
                sendAction('keyup', key);
            });

            // --- 桌面端鼠标处理（用于调试） ---
            button.addEventListener('mousedown', (e) => {
                button.classList.add('pressed');
                sendAction('keydown', key);
            });

            window.addEventListener('mouseup', () => {
                if (button.classList.contains('pressed')) {
                    button.classList.remove('pressed');
                    sendAction('keyup', key);
                }
            });
        });

        // 定期检查服务器状态
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                updateStatus(data.status === 'running');
            } catch {
                updateStatus(false);
            }
        }
        setInterval(checkStatus, 5000);
        checkStatus();

        // 禁用页面缩放和滚动，提升手感
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
